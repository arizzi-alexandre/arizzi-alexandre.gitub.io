---
layout: default
---
<article>
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b %Y" }}</time>{% if page.duration %}, about {{ page.duration }}{% endif %}{% if page.tools %}, tools: {{ page.tools }}{% endif %}
  </p>
  {{ content }}
  <a class="back" href="{{ '/notes/' | relative_url }}">Back to all write-ups</a>
</article>
